name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

env:
  # The SQL test runner, pinned like the vgi-starter's (Makefile HAYBARN_VERSION).
  HAYBARN_VERSION: "2.0.0rc11"

jobs:
  build-test:
    name: Build, vet, fmt, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

  # SQL end-to-end: test/sql/*.test through the published haybarn-unittest
  # runner and the signed community `vgi` extension, over each transport
  # (stdio, launch = DuckDB-managed AF_UNIX socket, http). ci/run-integration.sh
  # (adapted from the vgi-starter) seeds the OpenSearch service container's
  # index and fails on any unexpected skip.
  integration:
    name: SQL E2E (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, launch, http]
    services:
      opensearch:
        image: opensearchproject/opensearch:2.17.0
        ports:
          - 9209:9200
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      VGI_ES_TEST_URL: http://127.0.0.1:9209
      VGI_ES_TEST_INDEX: vgi_es_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Build the worker
        run: go build -o vgi-elasticsearch-worker ./cmd/vgi-elasticsearch-worker

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/vgi-elasticsearch-worker" HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
            TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  # Metadata quality gate: build the worker and run the vgi-lint metadata-quality
  # linter (it force-installs the signed vgi community extension itself, queries
  # the worker's catalog/schema/function metadata, and fails on any finding at
  # the configured severity). Kept as a separate job so it's independently visible.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build the worker
        run: go build -o vgi-elasticsearch-worker ./cmd/vgi-elasticsearch-worker

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "${{ github.workspace }}/vgi-elasticsearch-worker"
          fail-on: info
